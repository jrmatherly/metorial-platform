# golangci-lint configuration for mcp-engine
# Gradually tighten these rules as technical debt is addressed
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  # Start with a reasonable set for existing codebase
  # Add stricter linters as issues are resolved
  enable:
    - govet
    - staticcheck  # includes gosimple in v2
    - ineffassign
    - unused
  disable:
    # Temporarily disabled until existing issues are addressed
    # TODO: Enable errcheck and fix all unchecked errors (50+ instances)
    - errcheck

  settings:
    staticcheck:
      checks:
        - all
        # Disable specific checks causing issues in existing code
        - "-SA9003"  # Empty branch
        # TODO: Enable these after fixing existing style violations
        # See: https://github.com/metorial/metorial-platform/issues/XXX
        - "-ST1000"  # Package comments (50+ files need comments)
        - "-ST1003"  # Naming conventions (sessionId→sessionID, etc.)
        - "-ST1016"  # Receiver name consistency
        - "-ST1020"  # Comment format on exported methods
        - "-QF1008"  # Embedded field selector simplification

  exclusions:
    # Exclude generated code and vendor directories
    paths:
      - vendor
      - pkg/proto-mcp-manager
      - ".*\\.pb\\.go$"
      - ".*_generated\\.go$"
    # Use strict mode for generated file detection
    generated: strict

issues:
  # Maximum issues count per linter
  max-issues-per-linter: 50
  max-same-issues: 10
