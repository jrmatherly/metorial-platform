# Metorial Self-Hosting Docker Compose
#
# Usage:
#   mise run selfhost:up       # Start all services
#   mise run selfhost:build    # Build local images first
#   mise run selfhost:status   # Check service health
#
# For local development, build images first:
#   mise run selfhost:build-api
#   mise run selfhost:build-engine
#
# Then update the 'image:' lines below to use ':local' tags

services:
  etcd:
    image: bitnamilegacy/etcd:latest
    ports:
      - '32379:2379'
      - '32380:2380'
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - '32707:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo

  redis-db:
    image: redis:latest
    ports:
      - '36379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.14
    ports:
      - '37700:7700'
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-metorial-dev-master-key-min16}
    restart: unless-stopped

  postgres-db:
    image: postgres:17
    ports:
      - '35432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    command: postgres -c 'max_connections=1000'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server --console-address ":9001" /data
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false  # Changed from true to avoid ulimit issues
      - DISABLE_SECURITY_PLUGIN=true   # disable SSL & auth
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=admin
    # Removed ulimits as they can cause permission issues on some systems
    ports:
      - "9200:9200"
      - "9600:9600"  # Performance analyzer
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=admin
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true   # disable SSL & auth
    depends_on:
      - opensearch
    restart: unless-stopped

  api:
    # Use local build: 'mise run selfhost:build-api' then change to 'metorial-api:local'
    # Or use remote: ghcr.io/metorial/metorial-api:dev
    image: ${METORIAL_API_IMAGE:-metorial-api:local}
    environment:
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@localhost}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Metorial}
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/postgres
      - REDIS_URL=redis://:@redis-db:6379/0
      - USAGE_MONGO_URL=mongodb://mongo:mongo@mongodb:27017
      - CODE_WORKSPACE_SERVICE_ADDRESS=http://code-workspace:3000
      - OPENSEARCH_HOST=http://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=admin
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-metorial-dev-master-key-min16}
      # S3/MinIO Configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minio
      - S3_SECRET_ACCESS_KEY=minio123
      - S3_REGION=us-east-1
      - S3_BUCKET=metorial
      - PROVIDER_OAUTH_TICKET_SECRET=${SECRET}
      - AUTH_TICKET_SECRET=${SECRET}
      - ENCRYPTION_SECRET=${SECRET}
      - API_URL=${HOST}:4310
      - APP_URL=${HOST}:4300
      - MCP_URL=${HOST}:4311
      - PROVIDER_OAUTH_URL=${HOST}:4313
      - PORTALS_URL=${HOST}:4315
      - INTEGRATIONS_API_URL=${HOST}:4316
      - DENO_DEPLOY_TOKEN=placeholder
      - DENO_ORGANIZATION_ID=placeholder
      - SCM_GITHUB_CLIENT_ID=placeholder
      - SCM_GITHUB_CLIENT_SECRET=placeholder
      - METORIAL_ENV=production
      - NODE_ENV=production
      - ENGINE_MANAGER_ADDRESSES=engine:50050
    ports:
      - '4310:4310' # API
      - '4311:4311' # MCP
      - '4312:4312' # Marketplace
      - '4313:4313' # OAuth
      - '4314:4314' # Private API
      - '4315:4315' # Portals
      - '4321:4321' # ID API
      - '4316:4316' # Integrations API
    depends_on:
      - postgres-db
      - redis-db
      - mongodb
      - meilisearch
      - etcd
      - opensearch
    restart: unless-stopped

  engine:
    # Use local build: 'mise run selfhost:build-engine' then change to 'metorial-engine:local'
    # Or use remote: ghcr.io/metorial/metorial-mcp-engine-unified:dev
    image: ${METORIAL_ENGINE_IMAGE:-metorial-engine:local}
    ports:
      - '50050:50050'
    depends_on:
      - postgres-db
      - redis-db
      - etcd
    environment:
      - REDIS_ENDPOINTS=redis://:@redis-db:6379
      - ENGINE_DATABASE_DSN=host=postgres-db user=postgres password=postgres dbname=engine port=5432 sslmode=disable
      - ENGINE_MANAGER_ADDRESSES=localhost:50050
      - ENABLE_RESOURCE_CHECK=false
      - ETCD_ENDPOINTS=http://etcd:2379
    volumes:
      # Docker socket for spawning MCP server containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  meilisearch_data:
  postgres_data:
  minio_data:
  opensearch_data: