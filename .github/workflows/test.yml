name: 'Build and Test'

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'
    branches:
      - dev
      - main

env:
  MISE_EXPERIMENTAL: "1"
  MISE_VERSION: "2026.1.11"

jobs:
  build-and-test-ts:
    name: 'Build and Test TS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          cache: true
          cache_key_prefix: "mise-v1"
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mise_toml: |
            [tools]
            node = "24"
            bun = "1.3"

      - name: Install Packages
        run: bun i --linker=hoisted

      - name: Generate Prisma Clients
        run: bun run prisma:generate

      - name: Build Packages
        run: bun run build

      - name: Test
        run: bun run test

  build-and-test-engine:
    name: 'Build and Test Engine'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          cache: true
          cache_key_prefix: "mise-v1"
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mise_toml: |
            [tools]
            node = "24"
            bun = "1.3"
            go = "1.24"
            golangci-lint = "latest"

      - name: Install Go Dependencies
        run: go mod download
        working-directory: ./src/mcp-engine

      - name: Run Go Tests
        run: make test
        working-directory: ./src/mcp-engine

      - name: Run Go Vet
        run: make vet
        working-directory: ./src/mcp-engine

      - name: Run Go Lint
        run: make lint
        working-directory: ./src/mcp-engine
